<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Consentra — Shared record</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>try{var t=localStorage.getItem("consentra-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
<body>
  <header class="nav"><div class="nav__inner"><a class="nav__brand" href="/"><img class="nav__mark" src="/assets/mark.png" alt="" /><span class="nav__word">Consentra</span></a><div class="nav__user" id="meta"><span class="fine">Shared record · read only</span></div></div></header>
  <main><div class="glow"></div><div class="wrap clin page" id="app"><div class="empty">Loading…</div></div></main>
  <script src="/config.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const cfg = window.CONSENTRA; const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const token = location.pathname.split("/").filter(Boolean).pop();
    const app = document.getElementById("app");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fmt = (d) => { if (!d) return "—"; const x = new Date(d); return `${MON[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; };
    const fmtTs = (d) => d ? new Date(d).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
    const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : "";
    const countdown = (d) => { const m = Math.max(0, Math.floor((new Date(d) - Date.now()) / 60000)); const h = Math.floor(m / 60), dd = Math.floor(h / 24); if (dd >= 1) return `${dd} d ${h % 24} h`; if (h >= 1) return `${h} h ${m % 60} min`; return `${m} min`; };
    const CAT = {
      medications:   { label: "Medications",   ico: "teal",   svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg>' },
      allergies:     { label: "Allergies",     ico: "orange", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="M12 8v5"/><circle cx="12" cy="16" r=".6" fill="currentColor"/></svg>' },
      conditions:    { label: "Conditions",    ico: "pink",   svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6a4.6 4.6 0 0 0-8.8-2 4.6 4.6 0 0 0-8.8 2c0 5.4 8.8 10.4 8.8 10.4s8.8-5 8.8-10.4Z"/></svg>' },
      observations:  { label: "Lab Results",   ico: "purple", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5.5 9A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 9V3"/></svg>' },
      immunizations: { label: "Immunizations", ico: "green",  svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m14 4 6 6M16 8 8 16M4 20l3-3M7 13l4 4"/></svg>' },
    };
    // UK → US conversions shown beside the original value, never instead of it.
    const CONV = { "4548-4": (v, u) => u === "mmol/mol" ? `${(v / 10.929 + 2.15).toFixed(1)} %` : null, "2345-7": (v, u) => u === "mmol/L" ? `${Math.round(v * 18.016)} mg/dL` : null,
      "2093-3": (v, u) => u === "mmol/L" ? `${Math.round(v * 38.67)} mg/dL` : null, "2160-0": (v, u) => u === "µmol/L" ? `${(v / 88.42).toFixed(2)} mg/dL` : null, "718-7": (v, u) => u === "g/L" ? `${(v / 10).toFixed(1)} g/dL` : null };
    let providers = [];
    const prov = (id) => providers.find((x) => x.id === id);
    const initials = (p) => (p?.short_name ?? "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    const pfp = (p) => `<span class="pfp c${(providers.indexOf(p) % 4) + 1}" title="${esc(p?.name)}">${initials(p)}</span>`;
    const warn = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/></svg>';
    const sevIco = { critical: "red", high: "red", medium: "orange", low: "blue" };
    const ended = (status, label) => `<div class="ended"><div class="hero__mark float"><img src="/assets/logo-3d.png" alt=""></div><h2 class="sec__title">Access ended</h2><p class="lede" style="margin:16px auto 0">${status === "revoked" ? "The patient revoked this share." : status === "expired" ? "This share has expired." : "This link is not valid."}${label ? `<span class="fine" style="display:block;margin-top:8px">Share: ${esc(label)}</span>` : ""}</p></div>`;
    const row = (cat, r) => {
      let title, detail, when;
      switch (cat) {
        case "medications": title = r.display_name; detail = esc(`${r.dose_value ?? ""} ${r.dose_unit ?? ""} · ${cap(r.frequency ?? "")}`); when = r.recorded_at; break;
        case "allergies": title = r.display_name; detail = esc(`${cap(r.criticality ?? "")} criticality${r.reaction ? ` · ${r.reaction}` : ""}`); when = r.recorded_at; break;
        case "conditions": title = r.display_name; detail = esc(`${cap(r.clinical_status)}${r.onset_on ? ` · since ${fmt(r.onset_on)}` : ""}`); when = r.recorded_at; break;
        case "observations": { const c = CONV[r.loinc_code]?.(Number(r.value), r.unit); title = r.name; detail = `${esc(r.value)} ${esc(r.unit)}${c ? ` <span class="conv">US: ${esc(c)}</span>` : ""}`; when = r.observed_at; break; }
        case "immunizations": title = r.name; detail = fmt(r.occurred_on); when = r.occurred_on; break;
      }
      const p = prov(r.provider_id);
      return `<div class="grow noicon ${r.flagged ? "flag" : ""}"><div><div class="grow__t">${esc(title)}${r.flagged ? '<span class="tag bad">In question</span>' : ""}</div><div class="grow__d">${detail}</div><div class="grow__s">${esc(p?.short_name ?? "Unknown")} · ${fmt(when)}</div></div><div class="grow__r">${pfp(p)}</div></div>`;
    };
    const section = (cat, rows) => rows ? `<div><div class="section-head"><h3 class="row" style="gap:10px"><span class="ico ${CAT[cat].ico}" style="width:28px;height:28px">${CAT[cat].svg}</span>${CAT[cat].label}</h3><span class="fine">${rows.length} · from ${new Set(rows.map((x) => x.provider_id)).size} sources</span></div><div class="group">${rows.length ? rows.map((r) => row(cat, r)).join("") : '<div class="empty">None</div>'}</div></div>` : "";

    async function loadShare() {
      const { data, error } = await sb.rpc("get_share", { t: token, ua: navigator.userAgent });
      if (error) { app.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
      if (data.status !== "active") { app.innerHTML = ended(data.status, data.label); return; }
      providers = data.providers; const p = data.patient; const issues = data.discrepancies ?? [];
      const open = issues.filter((d) => d.status === "open" || d.status === "flagged");
      document.getElementById("meta").innerHTML = `<span class="live">Live · ends in ${countdown(data.expires_at)}</span>`;
      const verified = !!data.last_scan;
      app.innerHTML = `
        <div class="page__head">
          <div><p class="eyebrow">Shared by the patient</p><h2 class="sec__title">${esc(p.given_name)} ${esc(p.family_name)}<br><span class="dim">for ${esc(data.label)}</span></h2>
            <p class="lede">Born ${fmt(p.birth_date)} · Home ${esc(p.home_country)} · ${data.providers.length} sources · Sharing ${data.categories.map((c) => CAT[c]?.label ?? c).join(", ")}. Values are shown in the source's own units with a US conversion where applicable.</p></div>
          <div><div class="pass"><div class="pass__top"><img src="/assets/mark.png" alt=""><span class="pass__brand">Consentra</span><span class="pass__badge ${!verified ? "dim" : open.length ? "warn" : "ok"}">${!verified ? "Not verified" : open.length ? `${open.length} in question` : "Verified"}</span></div>
            <div class="pass__cap">Health Passport</div><div class="pass__name">${esc(p.given_name)} ${esc(p.family_name)}</div>
            <div class="pass__foot"><div class="pass__meta">${data.providers.length} sources connected<br>${verified ? `Verified ${fmtTs(data.last_scan.finished_at)}` : "Not checked across sources"}</div><div class="cluster">${data.providers.map(pfp).join("")}</div></div></div>
            <div class="pass__status"><i class="${verified ? "" : "off"}"></i>${verified ? "Integrity scan on record" : "No integrity scan"}</div></div>
        </div>
        ${verified ? (open.length
          ? `<div class="request"><span class="request__ico ico ${sevIco[open[0].severity]}">${warn}</span><div><div class="request__t">${open.length} open ${open.length === 1 ? "discrepancy" : "discrepancies"} between sources</div><div class="request__s">Rows marked “in question” are not verified. The patient's open questions are listed below.</div></div></div>`
          : `<div class="request"><span class="request__ico ico green">✓</span><div><div class="request__t">Verified record</div><div class="request__s">No open discrepancies between sources as of ${fmtTs(data.last_scan.finished_at)}.</div></div></div>`) : ""}
        <div><div class="section-head"><h3>Can access</h3></div><div class="group">${Object.keys(CAT).map((c) => `<div class="grow ${data.categories.includes(c) ? "" : "off"}"><span class="ico ${CAT[c].ico}">${CAT[c].svg}</span><div><div class="grow__t">${CAT[c].label}</div></div><div class="grow__r">${data.categories.includes(c) ? '<span class="check">✓</span>' : '<span class="notshared">Not shared</span>'}</div></div>`).join("")}</div></div>
        ${section("allergies", data.allergies)}${section("medications", data.medications)}${section("conditions", data.conditions)}${section("observations", data.observations)}${section("immunizations", data.immunizations)}
        ${data.include_unresolved && open.length ? `<div><div class="section-head"><h3>Open questions the patient wants you to see</h3></div><div class="group">${open.map((d) => `<div class="grow"><span class="ico ${sevIco[d.severity]}">${warn}</span><div><div class="grow__t">${esc(d.summary)}</div>${d.flagged_note ? `<div class="note"><b>Patient's note · </b>${esc(d.flagged_note)}</div>` : ""}${(d.evidence ?? []).length ? `<div class="row" style="margin-top:8px;gap:8px">${d.evidence.map((e) => `<a class="btn btn--ghost btn--sm" target="_blank" rel="noopener" href="${cfg.SUPABASE_URL}/functions/v1/share-evidence?token=${encodeURIComponent(token)}&id=${e.id}">${esc(e.caption || e.file_name)} ↗</a>`).join("")}</div>` : ""}<div class="grow__s" style="margin-top:6px"><span class="tag ${d.detected_by === "sodabase" ? "soda" : "violet"}">${d.detected_by === "sodabase" ? "Source health" : "Cross-provider check"}</span> ${d.status === "flagged" ? '<span class="tag info">Flagged for provider review</span>' : ""}</div></div><div class="grow__r"><span class="sev ${d.severity}">${d.severity}</span></div></div>`).join("")}</div></div>` : ""}
        <div class="glass glass--pad" style="margin-top:8px"><div class="section-head"><h3>Need more?</h3><span class="fine">Nothing is shared without the patient's yes</span></div>
          <div class="row" style="gap:8px;align-items:stretch">
            <input id="rq-who" type="text" placeholder="Your name · service (e.g. Dr. Chen · Cardiology)" style="flex:1;min-width:220px">
            <select id="rq-purpose"><option value="treatment">Treatment</option><option value="referral">Referral</option><option value="emergency">Emergency</option></select>
            <select id="rq-dur"><option value="24">24 hours</option><option value="168">7 days</option><option value="720" selected>30 days</option></select>
          </div>
          <div class="row" style="gap:8px;margin-top:10px" id="rq-cats">${Object.keys(CAT).map((c) => `<label class="scope ${data.categories.includes(c) ? "" : "on"}"><input type="checkbox" value="${c}" ${data.categories.includes(c) ? "" : "checked"} hidden><i></i>${CAT[c].label}</label>`).join("")}</div>
          <div class="row" style="margin-top:12px;gap:10px"><button class="btn btn--ios" id="rq-send">Request access</button><span class="fine" id="rq-state"></span></div></div>
        <p class="fine">This page updates when the patient changes or ends the share. Consentra never merges conflicting sources silently. Every open of this page is written to the patient's consent ledger.</p>`;
      document.querySelectorAll("#rq-cats label").forEach((l) => l.onclick = (e) => { e.preventDefault(); const i = l.querySelector("input"); i.checked = !i.checked; l.classList.toggle("on", i.checked); });
      document.getElementById("rq-send").onclick = async () => {
        const who = document.getElementById("rq-who").value.trim() || data.label; const cats = [...document.querySelectorAll("#rq-cats input:checked")].map((i) => i.value);
        if (!cats.length) return (document.getElementById("rq-state").textContent = "Pick at least one category");
        const { data: rid, error } = await sb.rpc("request_access", { requester: who.split("·")[0].trim(), requester_role: who, purpose: document.getElementById("rq-purpose").value, categories: cats, duration_hours: Number(document.getElementById("rq-dur").value), patient_code: token });   // the share token identifies THIS visitor's patient (0005), not the template
        const st = document.getElementById("rq-state"); if (error) return (st.textContent = error.message);
        st.textContent = "Sent · waiting for the patient…"; document.getElementById("rq-send").disabled = true;
        const poll = setInterval(async () => { const { data: r } = await sb.rpc("get_request_status", { req: rid }); if (!r || r.status === "pending") return; clearInterval(poll);
          st.innerHTML = r.status === "approved" ? `Allowed: ${r.granted.map((c) => CAT[c]?.label ?? c).join(", ")} · <a class="btn btn--ios" style="margin-left:6px" href="/s/${r.share_token}">Open</a>` : "Declined by the patient"; }, 3000);
      };
    }
    loadShare();
    setInterval(async () => { const { data } = await sb.rpc("share_status", { t: token }); if (data && data !== "active") app.innerHTML = ended(data); }, 5000);
  </script>
</body>
</html>
