name: Consentra
options:
  bundleIdPrefix: com.aliabdullah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  projectFormat: xcode15_3
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: YRL45Q79LJ
    CODE_SIGN_STYLE: Automatic
targets:
  Consentra:
    type: application
    platform: iOS
    sources: [Consentra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliabdullah.consentra
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Consentra/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Consentra/Info.plist
      properties:
        CFBundleDisplayName: Consentra
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Consentra talks to the Consentra demo server on your local network.
  ConsentraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ConsentraTests]
    dependencies:
      - target: Consentra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliabdullah.consentra.tests
        GENERATE_INFOPLIST_FILE: YES
  ConsentraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ConsentraUITests]
    dependencies:
      - target: Consentra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliabdullah.consentra.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Consentra
schemes:
  Consentra:
    build:
      targets:
        Consentra: all
        ConsentraTests: [test]
        ConsentraUITests: [test]
    test:
      targets: [ConsentraTests, ConsentraUITests]
